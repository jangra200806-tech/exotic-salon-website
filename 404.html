<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <title>Page Not Found - Exotic Hair &amp; Beauty Unisex Salon</title>
  <link rel="canonical" href="https://exotic-salon.vercel.app/404.html">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      text-align: center;
      padding: 100px 20px;
      background: var(--dark);
      color: var(--white);
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .error-page h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-family: var(--font-head);
      color: var(--gold);
      margin-bottom: 16px;
    }
    .error-page p {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--white);
      margin-bottom: 24px;
    }
    .error-page .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 52px;
      padding: 0 26px;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 600;
      background: var(--gold);
      color: var(--dark);
      text-decoration: none;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    .error-page .btn:hover {
      background: var(--gold-dark);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <section class="error-page">
    <h1>404</h1>
    <p>Page not found</p>
    <a class="btn" href="/">Home par wapas jao</a>
  </section>

  <script src="js/hero.js" defer></script>
</body>
</html>
